name = "mailfree"
# name = "mail-exhibit"
main = "src/server.js"
compatibility_date = "2024-01-01"
keep_vars=true

# D1 数据库绑定
[[d1_databases]]
binding = "TEMP_MAIL_DB"
database_name = "mail_free_db" #你的d1数据库名称
database_id = "8ab69977-afe3-492e-9870-a75d1712fa0c" # 你的database_id
# 登录会话过期时间（单位：天，默认7天）
# 环境变量
[vars]
# FORWARD_RULES="[{"prefix":"vip","email":"a@example.com"},{"prefix":"*","email":"example@qq.com"}]"
ADMIN_NAME="nyzx0322"
ADMIN_PASSWORD="2263631832li"
GUEST_PASSWORD="guest"
JWT_TOKEN="0w6Mv0Zj35bQg5YFk8eKJUiqX0F1Fl4dWnW3X4TH460COTG919m"
JWT_TOKENGUEST_PASSWORD="WnW3X4TH460COTG919m"
SESSION_EXPIRE_DAYS="365"
MAIL_DOMAIN="nyzx0322.eu.org"
RESEND_API_KEY="RESEND发件密钥"
SENDFLARE_API_KEY="SENDFLARE发件密钥"
CYBERPERSONS_API_KEY="CYBERPERSONS发件密钥"


# 静态资源目录（Workers + Assets）
[assets]
directory = "public"
# 显式指定绑定名，确保在 Worker 中通过 env.ASSETS 可用
binding = "ASSETS"


# R2 存储桶绑定（用于保存完整 EML 内容）
[[r2_buckets]]
binding = "MAIL_EML"
bucket_name = "mail-eml"

